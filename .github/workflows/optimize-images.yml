name: Optimize Images

# Compress images in img/ on every push, commit the result back.
on:
  push:
    branches: ["gh-pages"]
    paths: ["img/**", "scripts/**"]
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Optimize images
        run: python3 scripts/optimize_images.py

      - name: Commit optimized images
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add img/ scripts/
          (git diff --cached --quiet && echo "No changes") || \
            (git commit -m "Optimize images" && git push)
