name: Optimize Images

# Compress new images in img/ on every push, commit the result back.
# Only new images are processed to avoid churn on already-optimized files.
on:
  push:
    branches: ["gh-pages"]
    paths: ["img/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      full:
        type: boolean
        description: "Re-optimize all images (not only new ones)"
        default: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet Pillow

      - name: Optimize images
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python3 scripts/optimize_images.py
          else
            python3 scripts/optimize_images.py --only-new
          fi

      - name: Commit optimized images
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add img/ scripts/
          (git diff --cached --quiet && echo "No changes") || \
            (git commit -m "Optimize images" && git push)
